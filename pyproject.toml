[project]
name = "echostate"
version = "0.1.0"
description = "Activation steering evaluation for language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "torch>=2.13.0",
  "transformers>=5.15.0",
]

[project.scripts]
echostate = "echostate.main:main"
echostate-sweep = "echostate.sweep:main"
echostate-report = "echostate.report:main"

[project.optional-dependencies]
# Reporting and notebook analysis are optional: the library itself needs
# neither pandas nor matplotlib to extract activations and steer a model.
analysis = ["pandas>=2.0", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["echostate"]

[tool.setuptools.package-data]
# Templates are data, not modules, so they must be declared explicitly or an
# installed copy of the package would render an empty page.
echostate = ["templates/*.html", "templates/*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplification
  "RET",  # return consistency
]
ignore = [
  "B008",    # function call in default argument — not a pattern used here
  "SIM905",  # "".split() over a word list reads better than a quoted list literal
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pytest>=8.0",
    "ruff>=0.16.3",
]
